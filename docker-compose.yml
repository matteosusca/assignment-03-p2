services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: agar-rabbitmq
    ports:
      - "5672:5672"     # Porta protocollo AMQP
      - "15672:15672"   # Management Web UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
